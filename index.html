<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妹妹10岁生日快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ffcce6, #ff99cc, #ff66b2);
            color: #fff;
        }
        
        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }
        
        .content {
            text-align: center;
            max-width: 800px;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s, transform 1s;
        }
        
        .content.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        p {
            font-size: 1.5rem;
            line-height: 1.6;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .video-container {
            width: 80%;
            max-width: 800px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .navigation {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
        }
        
        .nav-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            margin: 15px 0;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        
        .nav-dot.active {
            background-color: white;
            transform: scale(1.3);
        }
        
        .balloon {
            position: absolute;
            width: 40px;
            height: 50px;
            background-color: #ff6b9d;
            border-radius: 50%;
            z-index: 1;
            animation: float 15s infinite ease-in-out;
        }
        
        .balloon::before {
            content: '';
            position: absolute;
            width: 5px;
            height: 50px;
            background-color: #ff6b9d;
            top: 50px;
            left: 18px;
        }
        
        .balloon::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff6b9d;
            border-radius: 50%;
            top: 100px;
            left: 15px;
        }
        
        .star {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fff;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: twinkle 5s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0);
            }
            25% {
                transform: translateY(-20px) translateX(10px) rotate(5deg);
            }
            50% {
                transform: translateY(-40px) translateX(-10px) rotate(-5deg);
            }
            75% {
                transform: translateY(-20px) translateX(5px) rotate(3deg);
            }
        }
        
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        
        .heart {
            position: absolute;
            font-size: 2rem;
            color: #ff3366;
            animation: heartbeat 1.5s infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }
        
        .message-box {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            h2 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1.2rem;
            }
            
            .video-container {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- 页面1：祝福标题 -->
    <div class="page" id="page1">
        <div class="content">
            <h1>10岁生日快乐！</h1>
            <h2>亲爱的妹妹</h2>
            <div class="message-box">
                <p>欢迎来到你的专属生日贺卡！</p>
                <p>向下滚动查看更多惊喜</p>
            </div>
        </div>
        
        <!-- 装饰元素 -->
        <div class="balloon" style="left: 10%; top: 20%;"></div>
        <div class="balloon" style="left: 20%; top: 60%; background-color: #66ccff;"></div>
        <div class="balloon" style="left: 85%; top: 30%; background-color: #ffcc66;"></div>
        <div class="balloon" style="left: 75%; top: 70%; background-color: #99ff99;"></div>
        
        <div class="star" style="left: 15%; top: 80%;"></div>
        <div class="star" style="left: 90%; top: 15%;"></div>
        <div class="star" style="left: 60%; top: 10%;"></div>
        
        <div class="heart" style="left: 5%; top: 10%;">❤️</div>
        <div class="heart" style="left: 95%; top: 90%;">❤️</div>
    </div>
    
    <!-- 页面2：生日寄语 -->
    <div class="page" id="page2">
        <div class="content">
            <h2>生日寄语</h2>
            <div class="message-box">
                <p>亲爱的妹妹，</p>
                <p>10岁是一个特别的年龄，标志着你的成长和进步！</p>
                <p>愿你的每一天都充满欢笑，每一刻都被爱包围。</p>
                <p>希望你的梦想像星星一样闪耀，你的未来像彩虹一样绚烂。</p>
                <p>永远保持你的纯真和善良，勇敢地追逐你的梦想！</p>
                <p>祝你生日快乐，天天开心！</p>
                <p style="text-align: right; margin-top: 20px;">—— 爱你的家人 ❤️</p>
            </div>
        </div>
        
        <!-- 装饰元素 -->
        <div class="balloon" style="left: 5%; top: 15%; background-color: #ffcc66;"></div>
        <div class="balloon" style="left: 90%; top: 50%; background-color: #66ccff;"></div>
        
        <div class="star" style="left: 10%; top: 40%;"></div>
        <div class="star" style="left: 80%; top: 20%;"></div>
        <div class="star" style="left: 70%; top: 80%;"></div>
        
        <div class="heart" style="left: 30%; top: 10%;">❤️</div>
        <div class="heart" style="left: 60%; top: 90%;">❤️</div>
    </div>
    
    <!-- 页面3：视频展示 -->
    <div class="page" id="page3">
        <div class="content">
            <h2>生日祝福视频</h2>
            <div class="video-container">
                <!-- 这里可以替换为你自己的视频 -->
                <video controls poster="https://placehold.co/800x450/ff99cc/white?text=生日祝福视频">
                    <source src="https://sample-videos.com/zip/10/mp4/SampleVideo_1280x720_1mb.mp4" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>
            <div class="message-box" style="margin-top: 30px;">
                <p>希望你喜欢这个特别的生日礼物！</p>
                <p>愿这个视频成为你美好回忆的一部分。</p>
            </div>
        </div>
        
        <!-- 装饰元素 -->
        <div class="balloon" style="left: 15%; top: 20%; background-color: #ffcc66;"></div>
        <div class="balloon" style="left: 80%; top: 25%; background-color: #99ff99;"></div>
        
        <div class="star" style="left: 20%; top: 70%;"></div>
        <div class="star" style="left: 85%; top: 65%;"></div>
        
        <div class="heart" style="left: 10%; top: 90%;">❤️</div>
        <div class="heart" style="left: 90%; top: 10%;">❤️</div>
    </div>
    
    <!-- 导航点 -->
    <div class="navigation">
        <div class="nav-dot active" data-page="0"></div>
        <div class="nav-dot" data-page="1"></div>
        <div class="nav-dot" data-page="2"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pages = document.querySelectorAll('.page');
            const navDots = document.querySelectorAll('.nav-dot');
            const contents = document.querySelectorAll('.content');
            
            // 初始化第一页内容为激活状态
            contents[0].classList.add('active');
            
            // 滚动到指定页面
            function scrollToPage(pageIndex) {
                pages[pageIndex].scrollIntoView({ behavior: 'smooth' });
                updateNavigation(pageIndex);
                activateContent(pageIndex);
            }
            
            // 更新导航点状态
            function updateNavigation(activeIndex) {
                navDots.forEach((dot, index) => {
                    if (index === activeIndex) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }
            
            // 激活当前页面内容
            function activateContent(pageIndex) {
                contents.forEach((content, index) => {
                    if (index === pageIndex) {
                        setTimeout(() => {
                            content.classList.add('active');
                        }, 500);
                    } else {
                        content.classList.remove('active');
                    }
                });
            }
            
            // 导航点点击事件
            navDots.forEach(dot => {
                dot.addEventListener('click', function() {
                    const pageIndex = parseInt(this.getAttribute('data-page'));
                    scrollToPage(pageIndex);
                });
            });
            
            // 鼠标滚轮事件
            let isScrolling = false;
            let currentPage = 0;
            
            window.addEventListener('wheel', function(e) {
                if (isScrolling) return;
                
                isScrolling = true;
                
                if (e.deltaY > 0 && currentPage < pages.length - 1) {
                    currentPage++;
                } else if (e.deltaY < 0 && currentPage > 0) {
                    currentPage--;
                }
                
                scrollToPage(currentPage);
                
                setTimeout(() => {
                    isScrolling = false;
                }, 1000);
            });
            
            // 键盘事件
            window.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowDown' && currentPage < pages.length - 1) {
                    currentPage++;
                    scrollToPage(currentPage);
                } else if (e.key === 'ArrowUp' && currentPage > 0) {
                    currentPage--;
                    scrollToPage(currentPage);
                }
            });
            
            // 触摸滑动事件（移动设备）
            let startY = 0;
            
            document.addEventListener('touchstart', function(e) {
                startY = e.touches[0].clientY;
            });
            
            document.addEventListener('touchend', function(e) {
                const endY = e.changedTouches[0].clientY;
                const diff = startY - endY;
                
                if (Math.abs(diff) > 50) { // 最小滑动距离
                    if (diff > 0 && currentPage < pages.length - 1) {
                        // 向下滑动
                        currentPage++;
                    } else if (diff < 0 && currentPage > 0) {
                        // 向上滑动
                        currentPage--;
                    }
                    
                    scrollToPage(currentPage);
                }
            });
            
            // 创建更多装饰元素
            function createDecorations() {
                const page1 = document.getElementById('page1');
                const page2 = document.getElementById('page2');
                const page3 = document.getElementById('page3');
                
                // 为页面1添加更多装饰
                for (let i = 0; i < 5; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 90 + 5 + '%';
                    star.style.top = Math.random() * 90 + 5 + '%';
                    star.style.animationDelay = Math.random() * 5 + 's';
                    page1.appendChild(star);
                }
                
                // 为页面2添加更多装饰
                for (let i = 0; i < 5; i++) {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 90 + 5 + '%';
                    heart.style.top = Math.random() * 90 + 5 + '%';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    page2.appendChild(heart);
                }
                
                // 为页面3添加更多装饰
                for (let i = 0; i < 3; i++) {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    balloon.style.left = Math.random() * 80 + 10 + '%';
                    balloon.style.top = Math.random() * 80 + 10 + '%';
                    balloon.style.animationDelay = Math.random() * 10 + 's';
                    
                    const colors = ['#ff6b9d', '#66ccff', '#ffcc66', '#99ff99'];
                    balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    page3.appendChild(balloon);
                }
            }
            
            createDecorations();
        });
    </script>
</body>
</html>
